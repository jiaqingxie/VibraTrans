[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibratrans"
version = "0.2.0"
description = "One-step IR–Raman spectral translation and frozen molecular features"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.4"]

[project.optional-dependencies]
analysis = ["pandas>=2", "scipy>=1.10", "scikit-learn>=1.3", "rdkit>=2023.9"]
data = ["rdkit>=2023.9", "lmdb>=1.4", "torch-geometric>=2.4"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
vibratrans = "vibratrans.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
